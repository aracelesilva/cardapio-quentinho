<style>
  :root{--creme:#F8F0E4;--amb:#D78A22;--amb2:#B9701A;--preto:#000;--branco:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--creme);color:var(--preto);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px}
  header{text-align:center}
  .foto{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--amb);box-shadow:0 0 0 7px var(--creme),0 0 0 9px var(--amb)}
  h1{font-weight:900;font-size:30px;margin:18px 0 4px;letter-spacing:-.5px}
  h1 span{color:var(--amb)}
  .sub{margin:0 0 6px;font-size:15px}
  .handle{display:inline-block;font-weight:800;color:var(--amb2);text-decoration:none}
  .dica{background:var(--branco);border:2px solid var(--preto);border-radius:14px;padding:10px 14px;margin:18px 0 6px;font-size:14px;box-shadow:4px 4px 0 var(--amb)}
  .prato{background:var(--branco);border:2px solid var(--preto);border-radius:18px;padding:18px 18px 14px;margin:22px 0;box-shadow:6px 6px 0 var(--amb)}
  .topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .tag{background:var(--preto);color:var(--branco);font-weight:800;font-size:11px;letter-spacing:.8px;padding:4px 10px;border-radius:99px;text-transform:uppercase}
  .tag.novo{background:var(--amb);color:var(--preto)}
  .data{font-size:12px;font-weight:600}
  .prato h2{font-size:20px;font-weight:900;margin:6px 0 6px;line-height:1.25}
  .prato p{margin:0 0 10px;font-size:15px}
  .links{list-style:none;padding:0;margin:8px 0 6px}
  .links li{margin:8px 0}
  .links a{display:block;text-decoration:none;color:var(--preto);background:var(--creme);border:2px solid var(--preto);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
  .links a small{display:block;font-weight:400;font-size:13px}
  .links a:active,.links a:hover{background:var(--amb)}
  .video{font-size:13px;font-weight:700;color:var(--amb2)}
  footer{text-align:center;font-size:13px;margin-top:30px}
  footer b{color:var(--amb2)}
</style>
